name: Build Forever release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shipped Lua and addon manifest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          while IFS= read -r source; do
            case "$source" in
              *.lua)
                test -f "$source" || { echo "Missing addon source: $source" >&2; exit 1; }
                luac5.1 -p "$source"
                ;;
            esac
          done < <(tr -d '\r' < ForeverThreat.toc)

      - name: Read addon version
        id: version
        shell: bash
        run: |
          VERSION=$(awk -F': ' '/^## Version:/ {print $2}' ForeverThreat.toc | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "Could not read ## Version from ForeverThreat.toc"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build WoWUp Forever package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf package
          mkdir -p package/ForeverThreat
          cp ForeverThreat.toc *.lua README.md package/ForeverThreat/
          cd package
          zip -r "../ForeverThreat-v${VERSION}-forever.zip" ForeverThreat

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          ASSET="ForeverThreat-v${VERSION}-forever.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "ForeverThreat ${TAG}" \
              --notes "WoW Forever package for ForeverThreat ${TAG}."
          fi
